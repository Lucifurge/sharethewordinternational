<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091d4a">
  <title>Page not found | SWACM International</title>
  <link rel="icon" type="image/png" href="assets/church-logo.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found { min-height: calc(100svh - 34px); display: grid; place-items: center; padding: 70px 0; background: radial-gradient(circle at 75% 25%, rgba(246,172,37,.14), transparent 32%), var(--cream); }
    .not-found-card { width: min(660px, 100%); padding: clamp(28px, 7vw, 64px); border-radius: 24px; text-align: center; background: white; border: 1px solid rgba(9,29,74,.08); box-shadow: 0 24px 70px rgba(9,29,74,.10); }
    .not-found-card img { width: 88px; height: 88px; object-fit: contain; border-radius: 50%; margin: 0 auto 25px; }
    .not-found-card .code { display: block; margin-bottom: 10px; color: #bd8620; font-size: 10px; letter-spacing: .25em; font-weight: 800; }
    .not-found-card h1 { margin: 0 0 14px; color: #091d4a; font: 800 clamp(34px, 8vw, 54px)/1.1 'Manrope', sans-serif; letter-spacing: -.06em; }
    .not-found-card p { max-width: 420px; margin: 0 auto 26px; color: #697187; font-size: 14px; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-card">
      <img src="assets/church-logo.png" alt="SWACM International church emblem">
      <span class="code">ERROR 404 · PAGE NOT FOUND</span>
      <h1>This page wandered off.</h1>
      <p>The page you are looking for may have moved or may no longer exist. Let's get you back to the main site.</p>
      <a class="button button-navy" href="index.html">Back to the homepage <span aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
